<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台管理 · 赛博因果测评</title>
<style>
  :root{ --cyan:#05d9e8; --mag:#d300c5; --bg:#07060f; --line:rgba(5,217,232,.25); --sub:#9aa; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,system-ui,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:radial-gradient(circle at 50% 0%, #1a0b2e, var(--bg));color:#e8f6ff;min-height:100vh;padding:24px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:560px}
  h1{font-size:20px;letter-spacing:2px;color:#fff;text-shadow:0 0 12px var(--cyan);margin:0 0 4px}
  .sub{color:var(--sub);font-size:13px;margin-bottom:18px}
  .card{background:rgba(10,8,22,.7);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 0 24px rgba(211,0,197,.15)}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(7,6,15,.7);color:#e8f6ff;font-size:15px;margin-bottom:10px;outline:none}
  button{cursor:pointer;border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:700;letter-spacing:1px;background:linear-gradient(90deg,var(--cyan),var(--mag));color:#04030a}
  button.del{background:rgba(255,92,138,.15);color:#ff8fb0;border:1px solid rgba(255,92,138,.4);padding:6px 12px;font-size:12px}
  button.ghost{background:rgba(255,255,255,.1);color:#cdd}
  .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .row:last-child{border-bottom:none}
  .row .pw{flex:1;font-family:monospace;color:var(--cyan)}
  .row .ct{color:var(--sub);font-size:13px}
  .row .bt{width:160px;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .st{width:60px;text-align:center;font-size:12px}
  .row .st.ok{color:var(--cyan)}
  .row .st.no{color:#ff8fb0}
  .filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
  .filterbar select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(7,6,15,.7);color:#e8f6ff;font-size:13px}
  .head .bt{flex:none;width:160px}
  .head .st{flex:none;width:60px;text-align:center}
  .msg{min-height:18px;font-size:13px;margin-bottom:6px}
  hr{border:none;border-top:1px solid rgba(255,255,255,.08);margin:14px 0}
  .head{display:flex;gap:12px;padding-bottom:4px;color:var(--sub);font-size:13px}
  .head b{flex:1;color:#cfe}
  .hide{display:none}
  .hint{color:var(--sub);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>后台管理</h1>
  <div class="sub">管理测试密码 · 查看使用统计 · 重置次数</div>

  <div id="loginSec" class="card">
    <input id="adminInput" type="password" placeholder="请输入管理密码" autocomplete="off">
    <button id="loginBtn">登录</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <div id="dashSec" class="card hide">
    <div class="head">
      <b>密码</b>
      <span class="bt">批次</span>
      <span class="st">状态</span>
      <span>使用次数</span>
    </div>
    <div class="filterbar">
      <select id="filterBatch"><option value="">全部批次</option></select>
      <select id="filterStatus">
        <option value="">全部状态</option>
        <option value="ok">可用</option>
        <option value="no">已用完</option>
      </select>
      <button id="exportXlsxBtn" class="ghost">导出 Excel（当前筛选）</button>
    </div>
    <div id="list"></div>
    <div id="dashMsg" class="msg"></div>

    <hr>
    <h3 style="font-size:14px;margin:0 0 8px">批量生成测评密码</h3>
    <div style="display:flex;gap:10px;align-items:center">
      <input id="genCount" type="number" min="1" max="200" value="10" style="width:120px;margin-bottom:0">
      <button id="genBtn">生成</button>
    </div>
    <div class="hint">数量 1-200。自动生成 16 位高强度随机密码（128 位熵），生成后直接入库可用。</div>
    <div id="genResult" class="hide" style="margin-top:10px">
      <div class="hint" id="genInfo"></div>
      <div id="genList" style="font-family:monospace;font-size:13px;color:var(--cyan);max-height:170px;overflow:auto;margin:6px 0;line-height:1.7"></div>
      <button id="exportBtn" class="ghost">导出本次生成的密码（.txt）</button>
    </div>

    <hr>
    <h3 style="font-size:14px;margin:0 0 8px">添加密码</h3>
    <input id="addInput" placeholder="输入新测试密码">
    <button id="addBtn">添加</button>

    <hr>
    <button id="resetBtn">一键重置所有次数</button>

    <hr>
    <h3 style="font-size:14px;margin:0 0 8px">修改管理密码</h3>
    <input id="oldPw" type="password" placeholder="原管理密码">
    <input id="newPw" type="password" placeholder="新管理密码">
    <button id="chgBtn">修改</button>

    <hr>
    <button id="logoutBtn" class="ghost">退出登录</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
